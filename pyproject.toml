[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dmotion"
version = "0.1.0"
description = "Local webcam experiment for money-spread detection"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["filelock>=3.19,<5"]

[project.optional-dependencies]
labeling = [
    "transformers>=5.10,<5.11",
]
vision = [
  "ultralytics>=8.4,<9",
  "opencv-python>=4.10,<5",
  "numpy>=1.26,<3",
  "pillow>=11,<13",
  "pygame>=2.6,<3",
  "clip @ git+https://github.com/ultralytics/CLIP.git@a13192f8cb767260d7dfd98c843b0716593169e7",
]

[project.scripts]
dmotion = "dmotion.cli:main"

[dependency-groups]
dev = [
    "bandit[toml]>=1.8,<2",
    "hatchling>=1.27,<2",
    "pip-audit>=2.10,<3",
    "pytest>=8,<10",
    "pytest-cov>=7,<8",
    "pytest-timeout>=2.4,<3",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dmotion"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=60"

[tool.coverage.run]
branch = true
source = ["dmotion", "scripts"]

[tool.coverage.report]
# Measured baseline is 68%; hardware/UI paths remain visible in reports.
fail_under = 65
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
