name: Checks

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact task commit to validate; blank uses the dispatched ref
        required: false
        type: string

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject a ref that advanced before dispatch
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python3 - <<'PY'
          import os, re
          expected = os.environ['EXPECTED_SHA']
          if expected:
              assert re.fullmatch(r'[0-9a-f]{40}', expected), 'Invalid expected commit'
              assert expected == os.environ['GITHUB_SHA'], 'Dispatched branch advanced; retry for its new head'
          PY

  unit:
    needs: validate-ref
    name: Core (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.22'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv sync --locked
      # Core tests deliberately need no webcam, audio device, or model downloads.
      - run: make check
      - name: Retain test, coverage, and static security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-${{ matrix.os }}-${{ matrix.python }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  dependencies:
    needs: validate-ref
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.22'
          python-version: '3.11'
          enable-cache: false
      - run: uv sync --locked
      - run: make audit
      - name: Retain dependency audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  package:
    needs: validate-ref
    name: Build and install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.22'
          python-version: '3.11'
          enable-cache: false
      - run: uv sync --locked
      - run: make package-check
      - name: Record artifact checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          retention-days: 30
          if-no-files-found: error

  codeql:
    needs: validate-ref
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}
          output: reports/codeql
          upload-database: false
      # Analysis success alone does not mean no vulnerabilities were found.
      - name: Reject high and critical findings
        run: python3 scripts/security_gate.py reports/codeql
      - name: Retain security analysis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-${{ matrix.language }}
          path: reports/codeql/
          retention-days: 14
          if-no-files-found: warn

  # Keep the protected check name stable. A missing/failed matrix must not pass.
  test:
    name: test
    needs: [validate-ref, unit, dependencies, package, codeql]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every automated gate to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          jobs = json.loads(os.environ['RESULTS'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'w') as summary:
              summary.write('| Gate | Result |\n| --- | --- |\n')
              for name, job in jobs.items():
                  summary.write(f"| {name} | {job['result']} |\n")
          sys.exit(not jobs or any(job['result'] != 'success' for job in jobs.values()))
          PY
